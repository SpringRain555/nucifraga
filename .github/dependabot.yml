# 每週檢查一次相依更新。升級前照 docs/environment/versions.md「怎麼更新這一份」處理。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 刻意釘在 6.x：vue-tsc 還不支援 7（versions.md 的上限、lessons「vue-tsc＋TS 7」）。
      # vue-tsc 支援之後拿掉這一條。
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
